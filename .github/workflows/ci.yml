name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # No submodules. This component depends on nothing: Broiler.Dom references
      # no project at all and Broiler.Dom.Html references only Broiler.Dom, which
      # is the position its rights register records and its guards enforce.
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Both legs build the same two platform-neutral net10.0 libraries. They run
      # anyway because a tokenizer is exactly where the two hosts disagree -
      # newlines, string comparison, and the culture the runtime picks up - and
      # because the entity decoding this component delegates to the platform is
      # the platform's on each host separately.
      - name: Build
        run: dotnet build Broiler.Dom.slnx -c Release --nologo

      - name: Test
        run: dotnet test Broiler.Dom.slnx -c Release --no-build --nologo

      # Proves the two packages still build from this commit. Both projects are
      # platform-neutral, so one host covers the set. Publishing is not automated
      # here: this workflow proves a package can be produced and nothing more.
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack Broiler.Dom.slnx -c Release --nologo -o ./artifacts
          echo "Packed:"
          ls -1 ./artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
